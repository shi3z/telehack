<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telehack — ログイン</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="center">
    <div class="card">
      <h1><span class="logo">◆</span> Telehack</h1>
      <p class="sub">ハッカソン運営システム。参加者名簿に登録済みのメールアドレスを入力すると、ログイン用のワンタイムURLが届きます。</p>
      <form id="loginForm">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        <div style="margin-top:16px">
          <button type="submit" id="submitBtn" style="width:100%">ログインリンクを送信</button>
        </div>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    if (new URLSearchParams(location.search).get('error') === 'invalid_token') {
      msg.className = 'msg err';
      msg.textContent = 'リンクが無効か期限切れです。もう一度メールアドレスを入力してください。';
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = '送信中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: document.getElementById('email').value})
        });
        const data = await res.json();
        msg.className = res.ok ? 'msg ok' : 'msg err';
        msg.textContent = res.ok ? data.message : (data.detail || 'エラーが発生しました');
      } catch {
        msg.className = 'msg err';
        msg.textContent = 'サーバーに接続できません';
      }
      btn.disabled = false; btn.textContent = 'ログインリンクを送信';
    });
  </script>
</body>
</html>
